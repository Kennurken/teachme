<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ source.title }} · Teach Me</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    .card { border: 1px solid #d0d7de; border-radius: 10px; padding: .8rem 1rem; margin: .8rem 0; }
    summary { cursor: pointer; color: #3730a3; }
    .quote { color: #57606a; font-size: .9rem; }
  </style>
</head>
<body>
  <p><a href="{% url 'home' %}">← Басты бет</a></p>
  <h1>{{ source.title }}</h1>
  <p>Режим: {{ source.generation_mode|upper }} · {{ cards|length }} карточка</p>

  {% for card in cards %}
    <div class="card">
      <p><strong>{{ card.position }}. {{ card.question }}</strong></p>
      <details>
        <summary>Жауапты көрсету</summary>
        <p>{{ card.answer }}</p>
        <p class="quote">Дәйексөз: «{{ card.source_quote }}»</p>
      </details>
    </div>
  {% endfor %}
</body>
</html>
